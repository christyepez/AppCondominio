name: appcondominio
services:
  appcondominio-api:
    build:
      context: .
      dockerfile: src/AppCondominio.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Organizations: Server=sqlserver,1433;Database=${SQLSERVER_DATABASE};User Id=sa;Password=${SQLSERVER_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
    ports:
      - "${APP_HTTP_PORT}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks: [appcondominio-network]

  appcondominio-worker:
    build:
      context: .
      dockerfile: src/AppCondominio.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Organizations: Server=sqlserver,1433;Database=${SQLSERVER_DATABASE};User Id=sa;Password=${SQLSERVER_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
    depends_on:
      sqlserver:
        condition: service_healthy
    networks: [appcondominio-network]

  appcondominio-web:
    build:
      context: .
      dockerfile: frontend/app-condominio-web/Dockerfile
    ports:
      - "${WEB_HTTP_PORT}:8080"
    depends_on:
      - appcondominio-api
    networks: [appcondominio-network]

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD}
    ports:
      - "${SQLSERVER_PORT}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '$$MSSQL_SA_PASSWORD' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [appcondominio-network]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    networks: [appcondominio-network]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [appcondominio-network]

  seq:
    image: datalust/seq:2025.2
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "${SEQ_PORT}:80"
    volumes:
      - seq-data:/data
    networks: [appcondominio-network]

volumes:
  sqlserver-data:
  redis-data:
  rabbitmq-data:
  seq-data:

networks:
  appcondominio-network:
    name: appcondominio-network
